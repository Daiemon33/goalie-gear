# Build and security-scan pipeline.
# Runs on every push and pull request to main. A HIGH or CRITICAL problem that
# has a fix available fails the run, so it can't be merged or deployed unnoticed.
# Every finding is also sent to the repo's Security tab (Code scanning).

name: Build and security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # lets me start a run by hand from the Actions tab

# Least privilege: by default every job can only read the code.
# Jobs that upload scan results ask for that one extra permission themselves.
permissions:
  contents: read

# If I push twice quickly, cancel the older run instead of doing the work twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to an exact commit (the long hash), not a tag like "v7".
# A tag can be moved to point at different code; a commit hash can't.
# The comment after each hash says which release it is.

jobs:
  image-scan:
    name: Build image and scan with Trivy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # later steps don't need the GitHub token

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image (not pushed anywhere yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true # keep the image on the runner so Trivy can scan it
          push: false
          tags: goalie-gear:${{ github.sha }}

      # Scan 1: report everything (all severities) to the Security tab. Never fails the run.
      - name: Trivy scan (full report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goalie-gear:${{ github.sha }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Scan 2: the quality gate. Fails on HIGH/CRITICAL problems that have a fix available.
      # Covers the OS packages and the Python packages installed from requirements.txt.
      - name: Trivy gate (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goalie-gear:${{ github.sha }}
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true # Trivy is already installed by the previous scan

  config-scan:
    name: Scan config with Checkov
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Checks the Dockerfile, this workflow file, any committed secrets,
      # and Terraform once it's added. Fails the run if any check fails.
      - name: Checkov scan
        uses: bridgecrewio/checkov-action@cc0e17d456ef1713bbfd963ebac19dc776775cb2 # v12.3128.0
        with:
          directory: .
          framework: dockerfile,github_actions,secrets,terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          soft_fail: false

      - name: Upload Checkov results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: checkov-results.sarif
          category: checkov
