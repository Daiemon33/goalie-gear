<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Goalie gear room{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">Goalie gear room</a>
    <nav>
      <a href="{{ url_for('index') }}">All gear</a>
      <a href="{{ url_for('checked_out_list') }}">Checked out</a>
      <a class="btn small" href="{{ url_for('new_item') }}">Add gear</a>
      {% if is_admin %}
        <form method="post" action="{{ url_for('logout') }}">
          <button class="btn small" type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Admin</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash {{ category }}" role="status">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
